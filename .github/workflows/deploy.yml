name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Google Fonts downloads can fail transiently during next/font builds.
      # Retry the unchanged build; do not replace the approved site fonts.
      - name: Build site (retry transient font download errors)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if pnpm build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after three attempts."
              exit 1
            fi
            sleep 20
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
